[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-selector"
version = "0.1.0"
description = "Prompt-orchestrated AI optimisation advisor for social innovation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "google-generativeai>=0.8,<1.0",
  "anthropic>=0.34,<1.0",
  "openai>=1.40,<2.0"
]
